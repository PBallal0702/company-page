<section class="features section" id="features">
  <div class="container">
    <div class="section-head" appReveal>
      <span class="eyebrow">Features</span>
      <h2 class="section-title">Everything your OPD operations need</h2>
      <p class="section-sub">
        One system, every role — from the front desk to the doctor's consultation desk.
      </p>
    </div>

    <div class="features__grid">
      @for (f of features; track f.title; let i = $index) {
        <div class="feature-card" appReveal [class]="'reveal-delay-' + ((i % 3) + 1)">
          <div class="feature-card__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              @switch (f.icon) {
                @case ('calendar') {
                  <rect x="3" y="5" width="18" height="16" rx="2"/>
                  <path d="M16 3v4M8 3v4M3 10h18"/>
                }
                @case ('stethoscope') {
                  <path d="M5 4v6a4 4 0 0 0 8 0V4"/>
                  <path d="M9 18a4 4 0 0 0 4-4v-2"/>
                  <circle cx="19" cy="17" r="2"/>
                  <path d="M5 4H3M13 4h2"/>
                }
                @case ('file') {
                  <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
                  <path d="M14 3v6h6"/>
                  <path d="M9 13h6M9 17h6"/>
                }
                @case ('heart') {
                  <path d="M12 20.5s-7.5-4.7-9.7-9.4C.7 7.6 2.4 4 6 4c2.1 0 3.6 1.2 6 3.6C14.4 5.2 15.9 4 18 4c3.6 0 5.3 3.6 3.7 7.1C19.5 15.8 12 20.5 12 20.5z"/>
                  <path d="M5 12h3l2-4 3 8 2-5h4"/>
                }
                @case ('pill') {
                  <rect x="3.5" y="9.5" width="17" height="7" rx="3.5" transform="rotate(-45 12 13)"/>
                  <path d="M9 9l6 6" transform="rotate(-45 12 13)"/>
                }
                @case ('users') {
                  <circle cx="9" cy="8" r="3.2"/>
                  <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
                  <circle cx="18" cy="8.5" r="2.4"/>
                  <path d="M15.5 14.3c2.6.4 4.5 2.7 4.5 5.7"/>
                }
                @case ('shield') {
                  <path d="M12 3l7 3v6c0 4.5-2.9 8-7 9-4.1-1-7-4.5-7-9V6z"/>
                  <path d="M9 12l2 2 4-4"/>
                }
                @case ('printer') {
                  <path d="M6 9V3h12v6"/>
                  <rect x="4" y="9" width="16" height="8" rx="2"/>
                  <path d="M6 17v4h12v-4"/>
                  <circle cx="17" cy="12.5" r="0.9" fill="currentColor" stroke="none"/>
                }
                @case ('building') {
                  <rect x="4" y="3" width="10" height="18" rx="1"/>
                  <path d="M14 8h6v13h-6"/>
                  <path d="M7.5 7h2M7.5 11h2M7.5 15h2"/>
                }
              }
            </svg>
          </div>
          <h3 class="feature-card__title">{{ f.title }}</h3>
          <p class="feature-card__desc">{{ f.desc }}</p>
        </div>
      }
    </div>
  </div>
</section>
